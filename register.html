<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convo - Register</title>

    <!-- Connect CSS -->
    <link rel="stylesheet" href="register.css">
</head>

<body>

<div class="container">

    <div class="register-box">

        <h1>Convo</h1>
        <p>Create Your Account</p>

        <form id="registerForm">

            <input type="text"
                   id="name"
                   placeholder="Full Name"
                   required>

            <input type="email"
                   id="email"
                   placeholder="Email Address"
                   required>

            <input type="password"
                   id="password"
                   placeholder="Password"
                   required>

            <input type="password"
                   id="confirmPassword"
                   placeholder="Confirm Password"
                   required>

            <button type="submit">
                Register
            </button>

        </form>

        <p class="login-link">
            Already have an account?
            <a href="login.html">Login</a>
        </p>

    </div>

</div>

<!-- Connect JavaScript -->
<script src="register.js"></script>

</body>
</html>
